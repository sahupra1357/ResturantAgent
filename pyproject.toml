[project]
name = "restaurant-ops"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.162.0",
    "highspy>=1.15.1",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psutil>=7.2.2",
    "pulp>=4.2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "redis>=5.0.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
